<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shobjify | Premium Store</title>
    
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Link -->
    <link rel="stylesheet" href="style.css">
    
    <!-- EmailJS for Automatic Emails -->
    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/@emailjs/browser@3/dist/email.min.js"></script>
    <script type="text/javascript">
        (function(){
            // EmailJS Public Key (আপনাকে EmailJS থেকে নিয়ে এখানে বসাতে হবে)
            emailjs.init("YOUR_PUBLIC_KEY");
        })();
    </script>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar">
        <div class="nav-content">
            <div class="brand">
                <img src="IMG_1120.jpeg" alt="Shobjify Logo" class="brand-logo" onerror="this.src='https://via.placeholder.com/50?text=S'">
                <h1 class="brand-name">Shobjify</h1>
            </div>
            <div class="contact-info">
                <i class="fab fa-whatsapp"></i> <span>01405141665</span>
            </div>
        </div>
    </nav>

    <!-- Main Products Section -->
    <main class="container">
        <h2 class="section-title">Exclusive Collections</h2>
        <div class="product-grid" id="product-grid">
            <!-- Products will be generated by JavaScript -->
        </div>
    </main>

    <!-- Checkout Modal (Hybrid App Style) -->
    <div class="modal-overlay" id="checkout-modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3><i class="fas fa-shopping-bag"></i> অর্ডার কনফার্ম করুন</h3>
                <button class="close-btn" onclick="closeModal()"><i class="fas fa-times"></i></button>
            </div>
            
            <div class="modal-body" id="modal-body">
                <div class="selected-product">
                    <h4 id="checkout-product-name">Product Name</h4>
                    <p class="checkout-price"><span id="checkout-product-price">0</span> ৳</p>
                </div>

                <!-- Quantity Selector -->
                <div class="quantity-wrapper">
                    <label>পরিমাণ:</label>
                    <div class="quantity-controls">
                        <button type="button" onclick="updateQty(-1)"><i class="fas fa-minus"></i></button>
                        <input type="number" id="qty-input" value="1" readonly>
                        <button type="button" onclick="updateQty(1)"><i class="fas fa-plus"></i></button>
                    </div>
                </div>

                <div class="total-bill">
                    <span>মোট বিল:</span>
                    <strong><span id="total-price">0</span> ৳</strong>
                </div>

                <!-- Order Form -->
                <form id="order-form" onsubmit="processOrder(event)">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="customer-name" placeholder="আপনার সম্পূর্ণ নাম" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-phone"></i>
                        <input type="tel" id="customer-phone" placeholder="আপনার মোবাইল নম্বর" required>
                    </div>
                    <div class="input-group">
                        <i class="fas fa-map-marker-alt"></i>
                        <textarea id="customer-address" rows="3" placeholder="সম্পূর্ণ ডেলিভারি ঠিকানা (জেলা, থানা, এলাকা)" required></textarea>
                    </div>
                    <button type="submit" class="submit-btn" id="submit-btn">
                        <span>কনফার্ম অর্ডার</span> <i class="fas fa-arrow-right"></i>
                    </button>
                </form>
            </div>

            <!-- Success Animation Screen -->
            <div class="success-screen" id="success-screen">
                <div class="success-animation">
                    <i class="fas fa-check-circle"></i>
                </div>
                <h2>Your Order is Confirmed!</h2>
                <p>ধন্যবাদ। আপনার অর্ডারটি সফলভাবে আমাদের কাছে পৌঁছেছে।</p>
                <button class="back-btn" onclick="closeModal()">ওয়েবসাইটে ফিরে যান</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
